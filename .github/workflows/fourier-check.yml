name: Verify Fourier in the Android file activity
on:
  push:
    branches: [verify/fourier-file-activity]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build v0.2.3 F-Droid flavor for the x86_64 emulator
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "ndk;28.0.13004108" "platforms;android-36"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          rustup target add x86_64-linux-android
          cargo install --locked cargo-ndk --version 4.1.2
          ./gradlew --no-daemon --max-workers=3 -PtargetAbis=x86_64 assembleFdroidDebug
          sha256sum app/build/outputs/apk/fdroid/debug/*.apk
      - name: Fetch public model and recording on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 2 https://huggingface.co/oruk/oruk-fourier-2b/resolve/8bcce21695e4ba13569c48de6cedffcb8a7576f5/Fourier-2B-Q8_0.gguf -o Fourier-2B-Q8_0.gguf
          curl -fLsS --retry 2 https://raw.githubusercontent.com/ggml-org/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav -o jfk.wav
          echo "6a7c419bd571f7b0e21da2d5ab1e3a1a3938a83470d622be57427af98f322981  Fourier-2B-Q8_0.gguf" | sha256sum -c
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" | sha256sum -c
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Transcribe in the Android app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          disk-size: 6144M
          heap-size: 512M
          emulator-options: -no-window -no-boot-anim -noaudio -no-metrics -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash verification/test-file-activity.sh
