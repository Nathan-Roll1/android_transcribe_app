name: Verify Fourier import through the Android system picker
on:
  push:
    branches: [verify/fourier-storage-picker]
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore the verified x86_64 F-Droid APK from the previous run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44990850004
          artifact-ids: 14741861467
          path: app/build/outputs/apk/fdroid/debug/
          merge-multiple: true
      - name: Fetch public model and recording on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 2 https://huggingface.co/oruk/oruk-fourier-2b/resolve/8bcce21695e4ba13569c48de6cedffcb8a7576f5/Fourier-2B-Q8_0.gguf -o Fourier-2B-Q8_0.gguf
          curl -fLsS --retry 2 https://raw.githubusercontent.com/ggml-org/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav -o jfk.wav
          echo "6a7c419bd571f7b0e21da2d5ab1e3a1a3938a83470d622be57427af98f322981  Fourier-2B-Q8_0.gguf" | sha256sum -c
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" | sha256sum -c
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Transcribe in the Android app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          disk-size: 10240M
          heap-size: 512M
          emulator-options: -no-window -no-boot-anim -noaudio -no-metrics -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash verification/test-storage-picker.sh

      - name: Save Android picker, import and transcript evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-storage-picker-evidence
          path: ${{ runner.temp }}/picker-evidence/
          if-no-files-found: warn
          retention-days: 14
